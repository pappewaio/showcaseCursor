server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Support for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Serve static files
    location /static/ {
        expires 1y;
        add_header Cache-Control "public";
    }

    # Serve README.md file
    location /README.md {
        add_header Content-Type "text/plain";
    }
} 